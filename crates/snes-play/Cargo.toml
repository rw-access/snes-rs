[package]
name = "snes-play"
version = "0.1.0"
description = "Optional desktop frontend entry point for snes-rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
winit-frontend = ["dep:cpal", "dep:softbuffer", "dep:winit"]
sdl2-frontend = ["dep:sdl2"]

[dependencies]
snes-core = { path = "../snes-core" }
cpal = { version = "0.16.0", optional = true }
softbuffer = { version = "0.4.8", optional = true }
sdl2 = { version = "0.38.0", optional = true }
winit = { version = "0.30.13", optional = true }

[[bin]]
name = "snes-play"
path = "src/main.rs"

[[bin]]
name = "snes-winit"
path = "src/nes_winit.rs"
required-features = ["winit-frontend"]

[[bin]]
name = "snes-sdl2"
path = "src/snes_sdl2.rs"
required-features = ["sdl2-frontend"]
