[package]
name = "snes-render"
version = "0.1.0"
description = "Headless rendering and ROM-test tools for snes-rs"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
snes-core = { path = "../snes-core" }
jpeg-decoder = { version = "0.3.2", default-features = false }
png = { version = "0.17.16", default-features = false }

[[bin]]
name = "snes-test"
path = "src/bin/snes-test.rs"
